<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Information - Admin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f3f3f6; color: #222; }
  .bar { background: #6A0F0F; color: #F1D18A; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .bar h1 { margin: 0; font-size: 20px; }
  .bar a { background: #F1D18A; color: #6A0F0F; padding: 8px 18px; border-radius: 6px; font-weight: bold; text-decoration: none; }
  .wrap { max-width: 900px; margin: 25px auto; padding: 0 15px; }
  .card { background: #fff; border-radius: 12px; padding: 22px; margin-bottom: 20px; box-shadow: 0 3px 14px rgba(0,0,0,.1); }
  .card h2 { margin-top: 0; color: #6A0F0F; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: #faf3e3; border-radius: 10px; text-align: center; padding: 16px 5px; }
  .stat b { display: block; font-size: 28px; color: #6A0F0F; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 9px 10px; border-bottom: 1px solid #e5e5e5; }
  td:first-child { font-weight: bold; color: #6A0F0F; width: 30%; }
  ul { line-height: 1.8; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
  <div class="bar">
    <h1>School Information</h1>
    <a href="./admin.html">&larr; Back to Dashboard</a>
  </div>

  <div class="wrap">
    <div class="card">
      <h2 id="sName"></h2>
      <p id="sTag"></p>
      <table id="sTable"></table>
    </div>

    <div class="card">
      <h2>Admission Summary</h2>
      <div class="stats">
        <div class="stat"><b id="nTotal">0</b>Total</div>
        <div class="stat"><b id="nPending">0</b>Pending</div>
        <div class="stat"><b id="nApproved">0</b>Approved</div>
        <div class="stat"><b id="nRejected">0</b>Rejected</div>
      </div>
    </div>

    <div class="card"><h2>Courses</h2><ul id="sCourses"></ul></div>
    <div class="card"><h2>Facilities</h2><ul id="sFacilities"></ul></div>
  </div>

  <script src="./Auth.js"></script>
  <script>
    if (sessionStorage.getItem("gra_admin") !== "yes") location.href = "login.html";

    function esc(t) {
      return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("sName").textContent = SCHOOL.name;
    document.getElementById("sTag").textContent = SCHOOL.tagline;
    document.getElementById("sTable").innerHTML =
      "<tr><td>Address</td><td>" + esc(SCHOOL.address) + "</td></tr>" +
      "<tr><td>Phone</td><td>" + esc(SCHOOL.phone) + "</td></tr>" +
      "<tr><td>Email</td><td>" + esc(SCHOOL.email) + "</td></tr>" +
      "<tr><td>Founded</td><td>" + esc(SCHOOL.founded) + "</td></tr>" +
      "<tr><td>Principal</td><td>" + esc(SCHOOL.principal) + "</td></tr>" +
      "<tr><td>Correspondent</td><td>" + esc(SCHOOL.correspondent) + "</td></tr>";

    document.getElementById("sCourses").innerHTML =
      SCHOOL.courses.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("");
    document.getElementById("sFacilities").innerHTML =
      SCHOOL.facilities.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("");

    var list = [];
    try { list = JSON.parse(localStorage.getItem("gra_applications") || "[]"); } catch (e) {}
    function count(s) { return list.filter(function (a) { return a.status === s; }).length; }
    document.getElementById("nTotal").textContent = list.length;
    document.getElementById("nPending").textContent = count("Pending");
    document.getElementById("nApproved").textContent = count("Approved");
    document.getElementById("nRejected").textContent = count("Rejected");
  </script>
</body>
</html>
